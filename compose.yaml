services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:${OPENCOACH_PORT:-8001}:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 6
