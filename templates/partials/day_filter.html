<div class="day-filter"><a href="?kind={{ kind }}" class="{% if not day %}selected{% endif %}">全部<span>课程</span></a>{% for d in days %}<a href="?day={{ d|date:'Y-m-d' }}&kind={{ kind }}" class="{% if day == d|date:'Y-m-d' %}selected{% endif %}">{{ d|date:'d' }}<span>{% if d == today %}今天{% else %}{{ d|date:'D' }}{% endif %}</span></a>{% endfor %}</div><div class="tabs"><a href="?day={{ day }}" class="{% if not kind %}active{% endif %}">全部类型</a>{% for value,label in kinds %}<a href="?day={{ day }}&kind={{ value }}" class="{% if kind == value %}active{% endif %}">{{ label }}</a>{% endfor %}</div>
