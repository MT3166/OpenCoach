<div class="exercise-editor" {% if fixed %}data-fixed="true"{% endif %}><div class="section-label"><span>{% if fixed %}填写实际完成数据{% else %}训练动作{% endif %}</span>{% if not fixed %}<button class="text-button" type="button" data-add-exercise>＋ 添加动作</button>{% endif %}</div><div data-exercise-rows></div><template><div class="exercise-row"><label class="exercise-name"><span>动作</span><input data-field="name" type="text" required maxlength="80" placeholder="例如：高脚杯深蹲"></label><label><span>组数</span><input data-field="sets" type="number" min="1" max="1000000" step="1" placeholder="—"></label><label><span>次数</span><input data-field="reps" type="number" min="1" max="1000000" step="1" placeholder="—"></label><label><span>重量 kg</span><input data-field="weight" type="number" min="0" max="1000000" step="0.01" placeholder="—"></label><label><span>时长 秒</span><input data-field="duration" type="number" min="1" max="1000000" step="1" placeholder="—"></label><button type="button" class="remove-row" aria-label="删除这个动作">×</button></div></template><p class="form-hint">按动作填写适用项，其他项目可留空；重量最多两位小数，自重动作填 0。</p></div>
