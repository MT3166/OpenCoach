<a class="plan-card" href="{% if user.is_staff %}{% url 'coach_plan' plan.id %}{% else %}{% url 'student_plan' plan.id %}{% endif %}"><div class="plan-art" aria-hidden="true"><svg class="icon"><use href="#i-training"/></svg></div><div class="plan-copy"><span class="small-label">{% if user.is_staff %}{{ plan.student.name }} · {% endif %}{{ plan.due_date|date:'m月d日' }}</span><h3>{{ plan.title }}</h3><p>{% if plan.submission.reviewed_at %}教练已点评{% elif plan.submission.submitted_at %}已提交，等待点评{% else %}{{ plan.exercises|length }} 个动作 · 待完成{% endif %}</p></div><span class="circle-arrow">↗</span></a>
