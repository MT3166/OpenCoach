<div class="wallet-grid">{% for card in wallet %}<div class="wallet-card {{ card.kind }}"><div class="wallet-label"><span>{{ card.label }}</span><span class="small-label">LESSON PASS</span></div><div class="wallet-number">{{ card.available }}<span>次可约</span></div><div class="wallet-meta"><span>剩余 {{ card.remaining }} 次</span><span>已约 {{ card.reserved }} 次</span></div></div>{% endfor %}</div>
